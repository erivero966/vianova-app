[pytest]
testpaths = tests
markers =
    unitaria: prueba unitaria de una función o módulo aislado
    integracion: prueba de integración entre API, base de datos e índice
    funcional: caso de prueba funcional asociado a un requerimiento (RF)
    seguridad: prueba de seguridad (autenticación, autorización, cifrado, entradas maliciosas)
    ia: prueba del componente de IA (exactitud, robustez, explicabilidad, seguridad del RAG)
    rnf: verificación de un requerimiento no funcional
filterwarnings =
    ignore::DeprecationWarning
